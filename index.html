    <script>
      // 첫 페인트 전에 두 가지를 정한다(깜빡임 방지).
      // 1) data-theme: 화면 테마(light/dark). 기본은 라이트이고, 저장된 선택(localStorage "choeae-theme")이 dark면 다크, system이면 시스템 설정을 따른다.
      // 2) data-zone: 인트로 구역이면 저장된 테마·시스템 설정과 상관없이 다크 + 스크롤 잠금. 인트로를 이미 봤거나(choeae-intro) #download 같은 직접 링크면 처음부터 메인 구역이다.
      (function () {
        var root = document.documentElement;
        var hash = location.hash;
        var query = location.search;
        var saved = null;
        var seen = false;
        try {
          saved = localStorage.getItem('choeae-theme');
          seen = localStorage.getItem('choeae-intro') === '1';
        } catch (e) {}
        var dark = saved === 'dark' || (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        root.dataset.theme = dark ? 'dark' : 'light';
        var intro = /[?&]intro=1/.test(query) || (!/[?&]intro=0/.test(query) && (hash === '#intro' || (!hash && !seen)));
        root.dataset.zone = intro ? 'intro' : 'main';
        // 인트로 연출이 시작되기 전까지 문구·버튼은 투명하게 둔다(미리 그려 둔 첫 화면이 깜빡이지 않게). 연출이 시작되면 engine이 지운다
        if (intro) root.dataset.pre = '';
        // 좁은 화면(화면이 세로로 쌓임)에서 직접 링크(#features 등)로 들어오면, 화면 밖 렌더링 생략(content-visibility)을 이번 방문에서는 끈다:
        // 화면마다 높이가 달라 예상 높이와 실제 높이가 어긋나면 도착한 화면이 밀리기 때문이다(레이아웃 이동). 데스크톱은 화면 높이가 정확히 100svh라 그대로 쓴다.
        else if (hash && !/^#(hero|intro)$/.test(hash) && window.innerWidth <= 1100) root.dataset.cvoff = '';
      })();
    </script>
